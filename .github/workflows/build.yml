name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.runner }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        backend: [WAYLAND, X11, XCB]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build pkg-config \
            libwayland-dev libwayland-bin libasound2-dev \
            libx11-dev libxcb1-dev libxcb-cursor-dev libxcb-keysyms1-dev \
            glslang-tools

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DGLVM_WINDOW_SYSTEM=${{ matrix.backend }}
          -DGLVM_BUILD_DOCS=OFF
          -DGLVM_SANITIZERS=OFF

      - name: Build
        run: cmake --build build --parallel

  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4

      # No -G/-A: the default Visual Studio generator uses the runner's host
      # arch (x64 on windows-latest, ARM64 on windows-11-arm).
      - name: Configure
        run: >
          cmake -S . -B build
          -DGLVM_BUILD_DOCS=OFF
          -DGLVM_SANITIZERS=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel
